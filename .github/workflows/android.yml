# 코드를 올리면 GitHub 이 대신 APK 를 빌드합니다.
# 완성된 APK 는 Releases 의 "latest-apk" 에 올라갑니다.
name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chess-trainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chess-trainer-apk
          path: chess-trainer.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 체스 트레이너 (최신 APK)
          prerelease: true
          files: chess-trainer.apk
          body: |
            최신 빌드 (${{ github.sha }})
            폰에서 chess-trainer.apk 를 받아 설치하세요.
            "출처를 알 수 없는 앱 설치" 허용이 필요할 수 있어요.
